# scanner/semgrep_rules/password_kdf.yaml
rules:
  - id: bcrypt-hash
    patterns:
      - pattern-either:
          - pattern: bcrypt.hash($PW, $ROUNDS, ...)
          - pattern: bcrypt.hashSync($PW, $ROUNDS)
          - pattern: bcrypt.genSalt($ROUNDS, ...)
          - pattern: bcrypt.genSaltSync($ROUNDS)
    languages: [javascript, typescript]
    severity: INFO
    message: "bcrypt/bcryptjs password hashing"
    metadata:
      cbom-asset-type: algorithm
      cbom-primitive: kdf
      cbom-algorithm-family: bcrypt
      cbom-algorithm-source: $ROUNDS
      cbom-parameter-role: cost-factor

  - id: argon2-hash
    patterns:
      - pattern-either:
          - pattern: argon2.hash($PW, ...)
          - pattern: "argon2.hash($PW, { type: $VARIANT, ... })"
    languages: [javascript, typescript]
    severity: INFO
    message: "Argon2 password hashing"
    metadata:
      cbom-asset-type: algorithm
      cbom-primitive: kdf
      cbom-algorithm-family: Argon2
      cbom-algorithm-source: $VARIANT

  - id: scrypt-js-hash
    patterns:
      - pattern-either:
          - pattern: scrypt($PW, $SALT, $OPTS, ...)
          - pattern: scryptSync($PW, $SALT, $KEYLEN)
    languages: [javascript, typescript]
    severity: INFO
    message: "scrypt key derivation (scrypt-js / scrypt package, non-built-in)"
    metadata:
      cbom-asset-type: algorithm
      cbom-primitive: kdf
      cbom-algorithm-family: scrypt
